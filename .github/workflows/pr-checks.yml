name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main]

jobs:
  branch-naming:
    name: Branch Naming
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Checking branch: $HEAD_REF"

          # Release PR (develop -> main, merge commit) is the one allowed exception
          if [ "$HEAD_REF" = "develop" ] && [ "$BASE_REF" = "main" ]; then
            echo "✅ Release PR develop -> main"
            exit 0
          fi

          # Allowed prefixes (kebab-case)
          ALLOWED="^(feat|fix|docs|chore|perf|security|refactor|test|build|ci|release)/"

          if echo "$HEAD_REF" | grep -qE "$ALLOWED"; then
            echo "✅ Branch name follows convention"
          else
            echo "::error::Branch name must start with one of: feat/, fix/, docs/, chore/, perf/, security/, refactor/, test/, build/, ci/, release/"
            echo "Example: fix/42-dialog-focus, feat/6-ui-primitives, release/v0.1.0"
            echo "Current: $HEAD_REF"
            exit 1
          fi

  pr-template:
    name: PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR description..."

          # Check for required sections
          MISSING=""

          if ! echo "$PR_BODY" | grep -qi "## What"; then
            MISSING="$MISSING\n  - ## What (description of the change)"
          fi

          if ! echo "$PR_BODY" | grep -qi "## Why"; then
            MISSING="$MISSING\n  - ## Why (the problem you're solving)"
          fi

          if ! echo "$PR_BODY" | grep -qi "## Testing"; then
            MISSING="$MISSING\n  - ## Testing (how you verified this works)"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::PR description is missing required sections:$MISSING"
            echo ""
            echo "Please fill out the PR template. Copy it from:"
            echo "https://github.com/codecoradev/codecora-ui/blob/develop/.github/PULL_REQUEST_TEMPLATE.md"
            exit 1
          fi

          echo "✅ PR description has required sections"

  commit-conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: $PR_TITLE"

          # Conventional Commits: type(scope): description
          # Types: feat, fix, docs, chore, perf, refactor, test, build, ci, security, release
          PATTERN="^(feat|fix|docs|chore|perf|refactor|test|build|ci|security|release)(\\(.+\\))?!?: .+"

          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title follows Conventional Commits"
          else
            echo "::error::PR title must follow Conventional Commits format"
            echo "Expected: type(scope): short description"
            echo "Example: fix(ui): restore dialog focus, release: v0.1.0"
            echo "Types: feat, fix, docs, chore, perf, refactor, test, build, ci, security, release"
            echo "Current: $PR_TITLE"
            exit 1
          fi

  message-standard:
    name: Message Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/message-standard.sh -
