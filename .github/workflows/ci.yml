name: CI

# The gate every PR and every push to develop or main must pass. Mirrors the
# local gates in AGENTS.md.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Run by hand on a branch with update_snapshots to remake the screenshot
  # baselines after an intended visual change (see e2e/README.md).
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Remake the screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools with a node shebang (svelte-check, vite, impeccable) need Node 22.17+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (Prettier, ESLint)
        run: bun run lint

      - name: Check (build packages, svelte-check every workspace)
        run: bun run check

      - name: Test (vitest, includes the contrast and design-doc checks)
        run: bun run test

      - name: Build (packages with publint, playground)
        run: bun run build

      - name: Contrast report (WCAG AA, every theme and accent)
        run: bun run contrast

      - name: Design detector (impeccable)
        run: bun run detect

      - name: Pack dry run (what npm would receive)
        run: bash scripts/publish.sh --dry-run

  # A real browser on the built playground: axe (WCAG 2.2 AA and best practice)
  # on every theme and page at 1280 px and 375 px. The unit tests run in jsdom,
  # which has no layout, so this is what catches landmarks, focus and contrast
  # as rendered. See e2e/README.md.
  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build (packages, registry, playground)
        run: bun run build

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: Axe scan
        run: bun run e2e

  # Screenshots of the built playground (every theme's page, plus the component
  # and dashboard pages in a few themes) at 1280 px and 375 px against the
  # baselines in e2e/__screenshots__. Pixels depend on the OS, so the baselines
  # are made on this same runner image. A failing diff uploads its images.
  visual:
    name: Visual snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build (packages, registry, playground)
        run: bun run build

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: Compare screenshots (or remake them)
        working-directory: e2e
        env:
          UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: |
          flags=""
          if [ "$UPDATE" = "true" ]; then flags="--update-snapshots"; fi
          bunx playwright test visual.spec.ts $flags

      - name: Upload the baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__

      - name: Upload the diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: e2e/test-results
