name: Release

# Publishes @codecora/* to npmjs.com with trusted publishing (OIDC) and
# provenance after a release PR (develop -> main) merges. Versions are set
# beforehand by a maintainer with changesets (`bun run version-packages`).
#
# Until the repository variable NPM_PUBLISH_ENABLED is "true" (set once the
# @codecora scope exists and trusts this workflow, #15), every run is a dry
# run: it packs each package and runs `npm publish --dry-run`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and dry-run only, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the <name>@<version> tags
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm 11
        run: npm install --global npm@11.21.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test and build
        run: |
          bun run test
          bun run build:packages

      - name: Choose mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          if [ "$PUBLISH_ENABLED" != "true" ]; then
            echo "NPM_PUBLISH_ENABLED is not true: dry run."
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ "$REF" != "refs/heads/main" ]; then
            echo "Only main publishes; $REF gets a dry run."
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "Manual run with dry_run: dry run."
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing."
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          FLAG: ${{ steps.mode.outputs.flag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish.sh $FLAG
